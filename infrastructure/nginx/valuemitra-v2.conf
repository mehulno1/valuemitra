# Nginx site for ValueMitra v2. The API also serves the built web app; Nginx serves static
# files directly and proxies /api. Certificates via certbot (`sudo certbot --nginx -d <host>`).
server {
    listen 80;
    server_name vmapps.techsahyogi.com;

    root /var/www/valuemitra-v2/apps/web/dist;
    index index.html;
    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~ /\. { deny all; }
}
