# ValueMitra — Nginx Site Configuration
# Location on EC2: /etc/nginx/sites-available/valuemitra
# Enable with: sudo ln -s /etc/nginx/sites-available/valuemitra /etc/nginx/sites-enabled/

# Rate limiting zone (shared memory, 10MB = ~160,000 IPs)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

server {
    listen 80;
    server_name vmapps.techsahyogi.com;

    # ── React SPA (web frontend) ──────────────────────────────
    root /var/www/valuemitra/apps/web/dist;
    index index.html;

    # SPA routing: serve index.html for unknown paths
    # (React Router handles client-side navigation)
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API reverse proxy ─────────────────────────────────────
    location /api/ {
        # Rate limit API calls (30 req/min, burst of 10)
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;

        # Headers — pass real client info to Express
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeouts — generous for long-running report generation
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;

        # File upload size limit (matches API's 10MB body limit + headroom)
        client_max_body_size 55M;
    }

    # ── Health check (no rate limit) ─────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Local file serving (dev-mode fallback) ────────────────
    # In production with S3, these requests won't be needed
    location /api/files/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 55M;
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Block dot-files (.env, .git, etc.) ───────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # Logs
    access_log /var/log/nginx/valuemitra-access.log;
    error_log  /var/log/nginx/valuemitra-error.log;
}

# NOTE: After running certbot, it will automatically add a second server block
# for HTTPS (port 443) and redirect HTTP → HTTPS. Do not edit manually.
